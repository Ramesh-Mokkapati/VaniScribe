name: Build Windows and macOS apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # YouTube changes often and yt-dlp follows quickly; a weekly rebuild picks up the latest yt-dlp.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write   # needed to attach the builds to a GitHub Release on tags

jobs:
  # The speech and translation models only change when their conversion script does, so they are
  # built once, cached, and shared with every build (converting needs 64-bit PyTorch).
  #
  # Time limits: every job and its long steps have one, well above a normal run, so a hang fails
  # fast instead of running for GitHub's default 6 hours (macOS minutes cost 10x on private repos).
  # Downloads separately abort and resume when a transfer stalls (scripts/build-common.ps1,
  # build_macos.sh, scripts/prepare_model.py).
  model:
    runs-on: windows-latest
    timeout-minutes: 90   # cold run: ~3.5 GB of downloads plus PyTorch and two conversions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        id: cache
        with:
          path: models
          key: speech-model-${{ hashFiles('scripts/prepare_model.py', 'scripts/build-common.ps1', 'requirements-model.txt') }}

      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.13"

      - name: Build models
        if: steps.cache.outputs.cache-hit != 'true'
        timeout-minutes: 75
        shell: pwsh
        run: ./prepare_model.ps1 -Python python

      - uses: actions/upload-artifact@v4
        with:
          name: speech-model
          path: models/
          if-no-files-found: error
          retention-days: 7

  build-windows:
    needs: model
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64     # 64-bit Windows 10/11
            venv: .venv
          - arch: x86     # 32-bit Windows
            venv: .venv-x86
    name: build (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-ctranslate2.txt

      - uses: actions/download-artifact@v4
        with:
          name: speech-model
          path: models

      - name: Build exe and package
        timeout-minutes: 30
        shell: pwsh
        run: ./build.ps1 -Arch ${{ matrix.arch }} -Python python

      - name: Smoke test bundled tools, imports and speech engine
        timeout-minutes: 15
        shell: pwsh
        run: |
          .\${{ matrix.venv }}\Scripts\python -c "import struct, wx, yt_dlp, docx, numpy, ytmp3.gui; from ytmp3.downloader import find_ffmpeg, find_js_runtime; from ytmp3.transcriber import missing_components; assert find_ffmpeg() and find_js_runtime(); assert not missing_components(), missing_components(); print(struct.calcsize('P') * 8, 'bit | wx', wx.version(), '| yt-dlp', yt_dlp.version.__version__, '| js', find_js_runtime()[0])"
          $bin = ".\vendor\${{ matrix.arch }}\bin"
          & "$bin\ffmpeg.exe" -hide_banner -version | Select-Object -First 1
          # The speech engine must load the model and decode audio in this architecture.
          & "$bin\ffmpeg.exe" -v error -f lavfi -i "sine=frequency=300:duration=3" -ar 16000 -ac 1 tone.wav
          & "$bin\whisper-cli.exe" -m models\ggml-telugu-small-q8_0.bin -l te -nt -f tone.wav
          if ($LASTEXITCODE -ne 0) { throw "whisper-cli failed with exit code $LASTEXITCODE" }
          # English translation: CTranslate2 on x64, the numpy engine on x86.
          .\${{ matrix.venv }}\Scripts\python -c "from ytmp3.nllb import NllbTranslator; t = NllbTranslator('models/nllb-200-600m-int8'); out = t.translate(['నమస్కారం మీరు ఎలా ఉన్నారు']); print(t.engine_name, '->', out); assert out[0].strip()"

      - uses: actions/upload-artifact@v4
        with:
          name: VaniScribe-${{ matrix.arch }}
          path: dist/VaniScribe-${{ matrix.arch }}/
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VaniScribe-${{ matrix.arch }}.zip
          generate_release_notes: true

  build-macos:
    needs: model   # the models are plain data files, shared with the Windows builds
    timeout-minutes: 75   # includes compiling whisper.cpp on a cold cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15         # Apple Silicon (M1 and later)
            key: macos-arm64
          - runner: macos-15-intel   # Intel Macs
            key: macos-x64
    runs-on: ${{ matrix.runner }}
    name: build (${{ matrix.key }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-ctranslate2.txt

      - uses: actions/download-artifact@v4
        with:
          name: speech-model
          path: models

      # whisper.cpp is compiled from source on macOS; cache the binary per tag and architecture.
      - uses: actions/cache@v4
        with:
          path: vendor/${{ matrix.key }}/bin/whisper-cli
          key: whisper-cli-${{ matrix.key }}-${{ hashFiles('build_macos.sh') }}

      - name: Build app
        timeout-minutes: 50
        run: bash build_macos.sh
        env:
          PYTHON: python

      - name: Smoke test bundled tools, imports, speech engine, translation and app launch
        timeout-minutes: 15
        run: |
          .venv-${{ matrix.key }}/bin/python -c "import platform, wx, yt_dlp, docx, numpy, ytmp3.gui; from ytmp3.downloader import find_ffmpeg, find_js_runtime; from ytmp3.transcriber import missing_components; assert find_ffmpeg() and find_js_runtime(); assert not missing_components(), missing_components(); print(platform.machine(), '| wx', wx.version(), '| yt-dlp', yt_dlp.version.__version__)"
          bin=vendor/${{ matrix.key }}/bin
          $bin/ffmpeg -hide_banner -version | head -1
          # The speech engine must load the model and decode audio on this architecture.
          $bin/ffmpeg -v error -f lavfi -i "sine=frequency=300:duration=3" -ar 16000 -ac 1 tone.wav
          $bin/whisper-cli -m models/ggml-telugu-small-q8_0.bin -l te -nt -f tone.wav
          .venv-${{ matrix.key }}/bin/python -c "from ytmp3.nllb import NllbTranslator; t = NllbTranslator('models/nllb-200-600m-int8'); out = t.translate(['నమస్కారం మీరు ఎలా ఉన్నారు']); print(t.engine_name, '->', out); assert out[0].strip()"
          # The packaged app must contain the models and its own speech engine.
          test -f dist/VaniScribe.app/Contents/Resources/models/ggml-telugu-small-q8_0.bin
          test -f dist/VaniScribe.app/Contents/Resources/models/nllb-200-600m-int8/model.bin
          find dist/VaniScribe.app -name whisper-cli -perm -u+x | grep -q .
          # The app must stay running (window open) rather than crash on start.
          dist/VaniScribe.app/Contents/MacOS/VaniScribe & pid=$!
          sleep 20
          kill -0 $pid && echo "app still running after 20s" && kill $pid

      - uses: actions/upload-artifact@v4
        with:
          name: VaniScribe-${{ matrix.key }}
          path: dist/VaniScribe-${{ matrix.key }}.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VaniScribe-${{ matrix.key }}.zip
          generate_release_notes: true
